version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: omnipulse
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: omnipulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:2.11-pg14
    environment:
      POSTGRES_USER: omnipulse
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: omnipulse
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  timescaledb_data:
